<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Iconița de tab: „e”-ul caligrafic din logo-ul hotelului (prima formă din logo.svg), alb pe fundalul
       paginii. Coordonatele din interiorul grupului sunt cele ale logo-ului.
       - „stanga”: linia lungă de intrare apare treptat.
